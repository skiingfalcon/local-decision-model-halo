[project]
name = "local-decision-model"
version = "0.1.0"
description = "Local hosting for decision models (Laya via laya-serve, Rune via llama-server) on the Strix Halo box"
requires-python = "==3.13.*"
dependencies = [
    "laya[serve]==0.3.26",
    # Instead of laya's `onnx` extra, which pulls CPU-only `onnxruntime`. Both packages
    # install the same `onnxruntime` module, and only the DirectML build reaches the iGPU.
    "onnx",
    "onnxscript",
    "onnxruntime-directml",
    "certifi",
    "psutil",
]

[tool.uv]
package = false
