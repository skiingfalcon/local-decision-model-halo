# DO NOT DEPLOY AS-IS. This check needs RUNE_METRICS=1, which is OFF: with llama-server's
# --metrics on, Rune hit Vulkan ErrorDeviceLost (GPU fault, reboot to recover) on its first
# requests on this machine (2026-10-04). Use the HTTP, process, performance-counter and log
# checks instead. Kept for a future llama.cpp/driver where --metrics is verified safe.
#
# llama-server's Prometheus metrics for Rune: tokens processed, requests in flight / queued,
# prompt throughput.
# /metrics sits behind the API key: put the same value as RUNE_API_KEY below (remove the
# headers block if no key is set).
# Copy to C:\ProgramData\Datadog\conf.d\openmetrics.d\conf.yaml, then restart the Agent.
#
# Useful series (names as exposed; Datadog prefixes them with the namespace):
#   llamacpp:prompt_tokens_total      counter  prompt tokens processed
#   llamacpp:n_decode_total           counter  forward passes (one or more per request)
#   llamacpp:prompt_tokens_seconds    gauge    prompt throughput, tokens/s
#   llamacpp:requests_processing      gauge    requests running now (max = RUNE_PARALLEL)
#   llamacpp:requests_deferred        gauge    requests waiting: alert if it stays > 0
init_config:

instances:
  - openmetrics_endpoint: http://127.0.0.1:8001/metrics
    namespace: rune
    metrics:
      - .*
    headers:
      Authorization: Bearer <RUNE_API_KEY>
    tags:
      - service:rune
      - app:local-decision-model
