# Is the server process alive, and how much CPU/RAM does it use.
# Copy to C:\ProgramData\Datadog\conf.d\process.d\conf.yaml, then restart the Agent.
init_config:

instances:
  - name: rune-llama-server
    search_string:
      - llama-server.exe
    tags:
      - service:rune
      - app:local-decision-model

  # Laya runs as python.exe from .venv-rocm; match its entry point on the command line.
  # Delete this block if you remove Laya.
  - name: laya-serve
    search_string:
      - laya-serve
    exact_match: false
    tags:
      - service:laya
      - app:local-decision-model
